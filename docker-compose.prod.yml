services:
  tic-tac-toe:
    image: ghcr.io/dre4success/tic-tac-toe-server:latest
    container_name: tic-tac-toe-app
    restart: unless-stopped
    environment:
      - PORT=4000
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web_proxy_net"
      # HTTP to HTTPS redirect
      - "traefik.http.routers.tictactoe-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.tictactoe-http.entrypoints=web"
      - "traefik.http.routers.tictactoe-http.middlewares=tictactoe-https-redirect"
      - "traefik.http.middlewares.tictactoe-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.tictactoe-https-redirect.redirectscheme.permanent=true"
      # HTTPS
      - "traefik.http.routers.tictactoe.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.tictactoe.entrypoints=websecure"
      - "traefik.http.routers.tictactoe.tls.certresolver=myresolver"
      - "traefik.http.services.tictactoe.loadbalancer.server.port=4000"
    networks:
      - web_proxy_net
networks:
  web_proxy_net:
    external: true